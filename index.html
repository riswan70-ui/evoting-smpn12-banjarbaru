<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Voting OSIS</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone untuk kompilasi JSX di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lucide-react@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG Icons
    const VoteIcon = () => (
      <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );
    const UsersIcon = () => (
      <svg className="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
    );
    const VoteBoxIcon = () => (
      <svg className="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
      </svg>
    );
    const ClockIcon = () => (
      <svg className="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );
    const ChartIcon = () => (
      <svg className="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
      </svg>
    );
    const SettingsIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
      </svg>
    );
    const SaveIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
      </svg>
    );
    const TrashIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    );
    const PlusIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
      </svg>
    );
    const EditIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
    );

    function App() {
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [adminPassword, setAdminPassword] = useState(() => {
        return localStorage.getItem('evoting_admin_password') || 'admin123';
      });
      const [inputPassword, setInputPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      
      const [schoolName, setSchoolName] = useState(() => {
        return localStorage.getItem('evoting_school_name') || 'SMPN 12 Banjarbaru';
      });
      const [appTitle, setAppTitle] = useState(() => {
        return localStorage.getItem('evoting_app_title') || 'E-Voting OSIS';
      });
      
      const [isSessionOpen, setIsSessionOpen] = useState(() => {
        const saved = localStorage.getItem('evoting_session_open');
        return saved !== null ? JSON.parse(saved) : true;
      });

      // PASLON PERSISTENCE
      const [candidates, setCandidates] = useState(() => {
        const saved = localStorage.getItem('evoting_candidates');
        return saved ? JSON.parse(saved) : [
          { id: '1', number: '01', name: 'Aditya Pratama & Siti Rahma', vision: 'Mewujudkan sekolah inklusif, kreatif, dan berakhlak mulia.', votes: 0 },
          { id: '2', number: '02', name: 'Bima Arya & Dewi Lestari', vision: 'Membangun generasi siswa berprestasi dan berwawasan lingkungan.', votes: 0 }
        ];
      });

      // DPT PERSISTENCE
      const [voters, setVoters] = useState(() => {
        const saved = localStorage.getItem('evoting_voters');
        return saved ? JSON.parse(saved) : [
          { id: '1', name: 'Ahmad Rizky', class: '9 A', token: 'S12-K89X', hasVoted: false },
          { id: '2', name: 'Budi Santoso', class: '8 B', token: 'S12-M2P7', hasVoted: false }
        ];
      });

      // TOKEN SYSTEM FOR VOTER
      const [inputToken, setInputToken] = useState('');
      const [currentVoter, setCurrentVoter] = useState(null);
      const [tokenError, setTokenError] = useState('');

      // Temp state for settings form
      const [tempSchoolName, setTempSchoolName] = useState(schoolName);
      const [tempAppTitle, setTempAppTitle] = useState(appTitle);
      const [newAdminPassword, setNewAdminPassword] = useState('');
      const [saveSuccessMessage, setSaveSuccessMessage] = useState('');

      // Modals
      const [showAddPaslonModal, setShowAddPaslonModal] = useState(false);
      const [showAddVoterModal, setShowAddVoterModal] = useState(false);
      const [editPaslonData, setEditPaslonData] = useState(null);

      // Forms
      const [paslonNumber, setPaslonNumber] = useState('');
      const [paslonName, setPaslonName] = useState('');
      const [paslonVision, setPaslonVision] = useState('');
      const [paslonMisi, setPaslonMisi] = useState('');
      const [paslonProgra, setPaslonProgra] = useState('');
      const [paslonPhoto, setPaslonPhoto] = useState('');

      const [voterName, setVoterName] = useState('');
      const [voterClass, setVoterClass] = useState('');

      // Persistent saves on change - GUARANTEE ALL CHANGES ARE SAVED PERMANENTLY
      useEffect(() => {
        localStorage.setItem('evoting_candidates', JSON.stringify(candidates));
      }, [candidates]);

      useEffect(() => {
        localStorage.setItem('evoting_voters', JSON.stringify(voters));
      }, [voters]);

      useEffect(() => {
        localStorage.setItem('evoting_session_open', JSON.stringify(isSessionOpen));
      }, [isSessionOpen]);

      useEffect(() => {
        setTempSchoolName(schoolName);
        setTempAppTitle(appTitle);
      }, [schoolName, appTitle]);

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (inputPassword === adminPassword) {
          setIsAdminLoggedIn(true);
          setShowLoginModal(false);
          setInputPassword('');
          setLoginError('');
        } else {
          setLoginError('Password Admin Salah!');
        }
      };

      // Simpan Perubahan Pengaturan & Data Permanen
      const handleSaveChanges = () => {
        setSchoolName(tempSchoolName);
        setAppTitle(tempAppTitle);
        localStorage.setItem('evoting_school_name', tempSchoolName);
        localStorage.setItem('evoting_app_title', tempAppTitle);
        localStorage.setItem('evoting_candidates', JSON.stringify(candidates));
        localStorage.setItem('evoting_voters', JSON.stringify(voters));
        localStorage.setItem('evoting_session_open', JSON.stringify(isSessionOpen));

        if (newAdminPassword.trim() !== '') {
          setAdminPassword(newAdminPassword);
          localStorage.setItem('evoting_admin_password', newAdminPassword);
          setNewAdminPassword('');
        }

        setSaveSuccessMessage('Seluruh data dan perubahan berhasil disimpan secara permanen!');
        setTimeout(() => setSaveSuccessMessage(''), 3500);
      };

      const handleTokenSubmit = (e) => {
        e.preventDefault();
        if (!isSessionOpen) {
          setTokenError('Sesi Pemilihan Sedang Ditutup!');
          return;
        }
        const voter = voters.find(v => v.token.toUpperCase() === inputToken.trim().toUpperCase());
        if (!voter) {
          setTokenError('Token tidak valid!');
          return;
        }
        if (voter.hasVoted) {
          setTokenError('Token ini sudah digunakan untuk memilih!');
          return;
        }
        setCurrentVoter(voter);
        setTokenError('');
      };

      const handleCastVote = (candidateId) => {
        if (!currentVoter) return;

        // Update votes & save state
        const updatedCandidates = candidates.map(c => c.id === candidateId ? { ...c, votes: c.votes + 1 } : c);
        const updatedVoters = voters.map(v => v.id === currentVoter.id ? { ...v, hasVoted: true } : v);

        setCandidates(updatedCandidates);
        setVoters(updatedVoters);
        
        localStorage.setItem('evoting_candidates', JSON.stringify(updatedCandidates));
        localStorage.setItem('evoting_voters', JSON.stringify(updatedVoters));

        setCurrentVoter(null);
        setInputToken('');
        alert('Terima kasih! Suara Anda berhasil disimpan.');
      };

      const handleAddOrEditPaslon = (e) => {
        e.preventDefault();
        let updated;
        if (editPaslonData) {
          updated = candidates.map(c => c.id === editPaslonData.id ? {
            ...c, number: paslonNumber, name: paslonName, vision: paslonVision, photo: paslonPhoto
          } : c);
        } else {
          const newCand = {
            id: Date.now().toString(),
            number: paslonNumber,
            name: paslonName,
            vision: paslonVision,
            photo: paslonPhoto,
            votes: 0
          };
          updated = [...candidates, newCand];
        }
        setCandidates(updated);
        localStorage.setItem('evoting_candidates', JSON.stringify(updated));

        setShowAddPaslonModal(false);
        setEditPaslonData(null);
        setPaslonNumber(''); setPaslonName(''); setPaslonVision(''); setPaslonPhoto('');
        setSaveSuccessMessage('Data Paslon berhasil disimpan!');
        setTimeout(() => setSaveSuccessMessage(''), 3000);
      };

      const handleAddVoter = (e) => {
        e.preventDefault();
        const randomToken = 'S12-' + Math.random().toString(36).substring(2, 6).toUpperCase();
        const newVoter = {
          id: Date.now().toString(),
          name: voterName,
          class: voterClass,
          token: randomToken,
          hasVoted: false
        };
        const updatedVoters = [...voters, newVoter];
        setVoters(updatedVoters);
        localStorage.setItem('evoting_voters', JSON.stringify(updatedVoters));

        setVoterName(''); setVoterClass('');
        setShowAddVoterModal(false);
        setSaveSuccessMessage('Pemilih Baru & Token berhasil ditambahkan!');
        setTimeout(() => setSaveSuccessMessage(''), 3000);
      };

      const handleDeleteVoter = (id) => {
        const updatedVoters = voters.filter(v => v.id !== id);
        setVoters(updatedVoters);
        localStorage.setItem('evoting_voters', JSON.stringify(updatedVoters));
      };

      const handleDeletePaslon = (id) => {
        const updatedCandidates = candidates.filter(c => c.id !== id);
        setCandidates(updatedCandidates);
        localStorage.setItem('evoting_candidates', JSON.stringify(updatedCandidates));
      };

      const handleSaveChanges = () => {
        setSchoolName(tempSchoolName);
        setAppTitle(tempAppTitle);
        localStorage.setItem('evoting_school_name', tempSchoolName);
        localStorage.setItem('evoting_app_title', tempAppTitle);
        localStorage.setItem('evoting_candidates', JSON.stringify(candidates));
        localStorage.setItem('evoting_voters', JSON.stringify(voters));
        localStorage.setItem('evoting_session_open', JSON.stringify(isSessionOpen));

        if (newAdminPassword.trim() !== '') {
          setAdminPassword(newAdminPassword);
          localStorage.setItem('evoting_admin_password', newAdminPassword);
          setNewAdminPassword('');
        }

        setSaveSuccessMessage('Seluruh perubahan data berhasil disimpan!');
        setTimeout(() => setSaveSuccessMessage(''), 3000);
      };

      const handleTokenSubmit = (e) => {
        e.preventDefault();
        if (!isSessionOpen) {
          setTokenError('Sesi Pemilihan Sedang Ditutup!');
          return;
        }
        const voter = voters.find(v => v.token.toUpperCase() === inputToken.trim().toUpperCase());
        if (!voter) {
          setTokenError('Token tidak valid!');
          return;
        }
        if (voter.hasVoted) {
          setTokenError('Token ini sudah digunakan untuk memilih!');
          return;
        }
        setCurrentVoter(voter);
        setTokenError('');
      };

      const handleCastVote = (candidateId) => {
        if (!currentVoter) return;

        // Update votes
        setCandidates(prev => prev.map(c => c.id === candidateId ? { ...c, votes: c.votes + 1 } : c));
        // Mark voter as voted
        setVoters(prev => prev.map(v => v.id === currentVoter.id ? { ...v, hasVoted: true } : v));

        setCurrentVoter(null);
        setInputToken('');
        alert('Terima kasih! Suara Anda berhasil disimpan.');
      };

      const handleAddOrEditPaslon = (e) => {
        e.preventDefault();
        if (editPaslonData) {
          setCandidates(candidates.map(c => c.id === editPaslonData.id ? {
            ...c, number: paslonNumber, name: paslonName, vision: paslonVision
          } : c));
        } else {
          const newCand = {
            id: Date.now().toString(),
            number: paslonNumber,
            name: paslonName,
            vision: paslonVision,
            votes: 0
          };
          setCandidates([...candidates, newCand]);
        }
        setShowAddPaslonModal(false);
        setEditPaslonData(null);
        setPaslonNumber(''); setPaslonName(''); setPaslonVision('');
      };

      const handleAddVoter = (e) => {
        e.preventDefault();
        const randomToken = 'S12-' + Math.random().toString(36).substring(2, 6).toUpperCase();
        const newVoter = {
          id: Date.now().toString(),
          name: voterName,
          class: voterClass,
          token: randomToken,
          hasVoted: false
        };
        setVoters([...voters, newVoter]);
        setVoterName(''); setVoterClass('');
        setShowAddVoterModal(false);
      };

      const handleDeleteVoter = (id) => {
        setVoters(voters.filter(v => v.id !== id));
      };

      const handleDeletePaslon = (id) => {
        setCandidates(candidates.filter(c => c.id !== id));
      };

      const handleResetVotes = () => {
        if (confirm("Apakah Anda yakin ingin mereset seluruh suara & status memilih siswa ke 0?")) {
          setCandidates(prev => prev.map(c => ({ ...c, votes: 0 })));
          setVoters(prev => prev.map(v => ({ ...v, hasVoted: false })));
          setSaveSuccessMessage('Seluruh suara telah direset.');
          setTimeout(() => setSaveSuccessMessage(''), 3000);
        }
      };

      const totalDPT = voters.length;
      const votesCount = voters.filter(v => v.hasVoted).reduce((acc, v) => acc + 1, 0);
      const totalVotes = candidates.reduce((acc, c) => acc + c.votes, 0);
      const remainingVoters = totalDPT - votesCount;
      const participationRate = totalDPT > 0 ? ((votesCount / totalDPT) * 100).toFixed(1) : 0;
      const maxVotes = Math.max(...candidates.map(c => c.votes), 1);

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col">
          {/* HEADER */}
          <header className="bg-indigo-600 text-white shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <div className="bg-white/20 p-2 rounded-lg">
                  <VoteIcon />
                </div>
                <div>
                  <h1 className="text-xl font-bold leading-tight">{appTitle}</h1>
                  <p className="text-xs text-indigo-200">{schoolName}</p>
                </div>
              </div>

              <div className="flex items-center space-x-2 bg-indigo-700/50 p-1 rounded-xl">
                <button
                  onClick={() => setIsAdminLoggedIn(false)}
                  className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs md:text-sm font-medium transition-all ${
                    !isAdminLoggedIn ? 'bg-white text-indigo-600 shadow' : 'text-indigo-100 hover:text-white'
                  }`}
                >
                  <span>Mode Pemilih</span>
                </button>
                <button
                  onClick={() => isAdminLoggedIn ? setIsAdminLoggedIn(true) : setShowLoginModal(true)}
                  className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs md:text-sm font-medium transition-all ${
                    isAdminLoggedIn ? 'bg-white text-indigo-600 shadow' : 'text-indigo-100 hover:text-white'
                  }`}
                >
                  <SettingsIcon />
                  <span>Panel Admin</span>
                </button>
              </div>
            </div>
          </header>

          {/* NOTIFIKASI TOAST */}
          {saveSuccessMessage && (
            <div className="bg-emerald-500 text-white py-2 px-4 text-center font-medium shadow-md text-sm">
              ✓ {saveSuccessMessage}
            </div>
          )}

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">

            {/* DASHBOARD STATS */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                  <p className="text-xs font-bold text-slate-400 uppercase">TOTAL DPT (PEMILIH)</p>
                  <h3 className="text-2xl font-bold text-slate-800">{totalDPT}</h3>
                </div>
                <div className="bg-indigo-50 p-3 rounded-xl"><UsersIcon /></div>
              </div>

              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                  <p className="text-xs font-bold text-slate-400 uppercase">SUARA MASUK</p>
                  <h3 className="text-2xl font-bold text-emerald-600">{votesCount}</h3>
                </div>
                <div className="bg-emerald-50 p-3 rounded-xl"><VoteBoxIcon /></div>
              </div>

              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                  <p className="text-xs font-bold text-slate-400 uppercase">BELUM MEMILIH</p>
                  <h3 className="text-2xl font-bold text-amber-600">{remainingVoters < 0 ? 0 : remainingVoters}</h3>
                </div>
                <div className="bg-amber-50 p-3 rounded-xl"><ClockIcon /></div>
              </div>

              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                  <p className="text-xs font-bold text-slate-400 uppercase">PARTISIPASI SUARA</p>
                  <h3 className="text-2xl font-bold text-indigo-600">{participationRate}%</h3>
                </div>
                <div className="bg-indigo-50 p-3 rounded-xl"><ChartIcon /></div>
              </div>
            </div>

            {/* IF VOTER MODE: LOGIN TOKEN OR BILIK SUARA */}
            {!isAdminLoggedIn && (
              currentVoter ? (
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                  <div className="flex justify-between items-center mb-6">
                    <div>
                      <h2 className="text-xl font-bold text-slate-800">Selamat Datang, {currentVoter.name} ({currentVoter.class})</h2>
                      <p className="text-sm text-slate-500">Silakan tentukan pilihan Anda dengan menekan tombol pada salah satu pasangan calon.</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {candidates.map((c) => (
                      <div key={c.id} className="border-2 border-slate-200 rounded-2xl p-6 flex flex-col justify-between bg-slate-50/50 hover:border-indigo-500 transition-all">
                        <div>
                          <span className="bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-md mb-3 inline-block">
                            Paslon {c.number}
                          </span>
                          <h3 className="text-xl font-bold text-slate-800 mb-2">{c.name}</h3>
                          <p className="text-xs text-slate-600 bg-white p-4 rounded-xl border border-slate-200 mb-6">
                            "{c.vision}"
                          </p>
                        </div>
                        <button
                          onClick={() => handleCastVote(c.id)}
                          className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-sm shadow-md transition-all active:scale-95"
                        >
                          Pilih Paslon {c.number}
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <div className="max-w-md mx-auto my-8">
                  <div className="bg-indigo-600 text-white p-8 rounded-t-2xl text-center">
                    <div className="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center mx-auto mb-3">
                      <VoteIcon />
                    </div>
                    <h2 className="text-xl font-bold">Selamat Datang Pemilih</h2>
                    <p className="text-xs text-indigo-100 mt-1">Masukkan Kode Token unik yang diberikan oleh Panitia OSIS</p>
                  </div>
                  <div className="bg-white p-6 rounded-b-2xl shadow-lg border border-slate-100 space-y-4">
                    <form onSubmit={handleTokenSubmit} className="space-y-4">
                      <div>
                        <label className="text-xs font-bold text-slate-400 block uppercase mb-1">KODE TOKEN PEMILIH</label>
                        <input
                          type="text"
                          placeholder="CONTOH: S12-K89X"
                          value={inputToken}
                          onChange={(e) => setInputToken(e.target.value)}
                          className="w-full text-center tracking-widest text-lg font-mono px-4 py-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 uppercase"
                        />
                      </div>
                      {tokenError && <p className="text-xs text-rose-600 font-medium text-center">{tokenError}</p>}
                      <button
                        type="submit"
                        className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm shadow-md transition-all"
                      >
                        Masuk Ke Bilik Suara →
                      </button>
                    </form>
                  </div>
                </div>
              )
            )}

            {/* QUICK COUNT & CONTROL */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              
              {/* CHART REALTIME */}
              <div className="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div className="flex justify-between items-center mb-6">
                  <div>
                    <h2 className="text-xl font-bold text-slate-800">Quick Count Real-Time</h2>
                    <p className="text-sm text-slate-500">Hasil Perolehan Suara Pasangan Calon Ketua & Wakil Ketua OSIS</p>
                  </div>
                  {isAdminLoggedIn && (
                    <button
                      onClick={() => { setEditPaslonData(null); setPaslonNumber(''); setPaslonName(''); setPaslonVision(''); setShowAddPaslonModal(true); }}
                      className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-2 rounded-xl flex items-center space-x-1"
                    >
                      <PlusIcon />
                      <span>Tambah Paslon</span>
                    </button>
                  )}
                </div>

                <div className="pt-6 pb-2 border-b border-slate-100">
                  <div className="h-64 flex items-end justify-around gap-4 px-4">
                    {candidates.map((c) => {
                      const heightPercent = maxVotes > 0 ? (c.votes / maxVotes) * 100 : 0;
                      const votePercentage = totalVotes > 0 ? ((c.votes / totalVotes) * 100).toFixed(1) : 0;

                      return (
                        <div key={c.id} className="flex-1 flex flex-col items-center h-full justify-end">
                          <div className="text-xs font-semibold text-slate-600 mb-2">
                            {c.votes} Suara ({votePercentage}%)
                          </div>
                          <div 
                            className="w-full max-w-[100px] bg-indigo-600 rounded-t-xl transition-all duration-500 flex items-center justify-center shadow-lg"
                            style={{ height: `${Math.max(heightPercent, 8)}%` }}
                          >
                            <span className="text-white font-bold text-sm">{c.votes}</span>
                          </div>
                          <div className="mt-3 text-xs font-medium text-slate-700 text-center truncate w-full">
                            Paslon {c.number}: {c.name.split('&')[0]}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* SESI & PENGATURAN ADMIN */}
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                  <h2 className="text-lg font-bold text-slate-800 mb-4 pb-3 border-b border-slate-100">
                    Status & Sesi Pemilihan
                  </h2>

                  <div className="space-y-3 mb-6">
                    <label className="text-xs font-bold uppercase text-slate-400 block">KONTROL SESI PEMUNGUTAN SUARA</label>
                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 flex items-center justify-between">
                      <span className={`px-3 py-1 rounded-full text-xs font-bold ${
                        isSessionOpen ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                      }`}>
                        {isSessionOpen ? 'SESI DIBUKA' : 'SESI DITUTUP'}
                      </span>

                      {isAdminLoggedIn && (
                        <button
                          onClick={() => setIsSessionOpen(!isSessionOpen)}
                          className={`px-3 py-1.5 rounded-lg text-xs font-semibold text-white transition-all ${
                            isSessionOpen ? 'bg-rose-600 hover:bg-rose-700' : 'bg-emerald-600 hover:bg-emerald-700'
                          }`}
                        >
                          {isSessionOpen ? 'Tutup Sesi' : 'Buka Sesi'}
                        </button>
                      )}
                    </div>
                  </div>

                  {isAdminLoggedIn && (
                    <div className="space-y-3">
                      <label className="text-xs font-bold uppercase text-slate-400 block">AKSI CEPAT DATA</label>
                      <button
                        onClick={handleResetVotes}
                        className="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-semibold py-2 px-4 rounded-xl text-xs flex items-center justify-center space-x-2 transition-all"
                      >
                        <TrashIcon />
                        <span>Reset Seluruh Suara</span>
                      </button>
                    </div>
                  )}
                </div>

                {/* TOMBOL SIMPAN PERUBAHAN & PENGATURAN */}
                {isAdminLoggedIn && (
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                    <h3 className="text-lg font-bold text-slate-800 pb-2 border-b border-slate-100">
                      Pengaturan Sistem
                    </h3>

                    <div>
                      <label className="text-xs font-medium text-slate-600 mb-1 block">Nama Sekolah</label>
                      <input
                        type="text"
                        value={tempSchoolName}
                        onChange={(e) => setTempSchoolName(e.target.value)}
                        className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-medium text-slate-600 mb-1 block">Judul Pemilihan</label>
                      <input
                        type="text"
                        value={tempAppTitle}
                        onChange={(e) => setTempAppTitle(e.target.value)}
                        className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-medium text-slate-600 mb-1 block">Ganti Password Admin</label>
                      <input
                        type="password"
                        placeholder="Password baru (opsional)"
                        value={newAdminPassword}
                        onChange={(e) => setNewAdminPassword(e.target.value)}
                        className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    {/* TOMBOL SIMPAN PERUBAHAN UTAMA */}
                    <button
                      onClick={handleSaveChanges}
                      className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-xl text-sm flex items-center justify-center space-x-2 shadow-md transition-all active:scale-95"
                    >
                      <SaveIcon />
                      <span>Simpan Perubahan</span>
                    </button>
                  </div>
                )}
              </div>
            </div>

            {/* TABEL PASLON & DPT (VISIBLE WHEN ADMIN) */}
            {isAdminLoggedIn && (
              <>
                {/* MANAJEMEN PASLON */}
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="text-lg font-bold text-slate-800">Manajemen Pasangan Calon (Paslon)</h3>
                      <p className="text-xs text-slate-500">Edit visi, misi, program kerja, atau kelola daftar kandidat</p>
                    </div>
                    <button
                      onClick={() => { setEditPaslonData(null); setPaslonNumber(''); setPaslonName(''); setPaslonVision(''); setShowAddPaslonModal(true); }}
                      className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-xl flex items-center space-x-1"
                    >
                      <PlusIcon />
                      <span>Tambah Paslon Baru</span>
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {candidates.map((c) => (
                      <div key={c.id} className="border border-slate-200 rounded-2xl p-4 flex justify-between items-center bg-slate-50/50">
                        <div className="flex items-center space-x-3">
                          <span className="w-10 h-10 bg-indigo-600 text-white font-bold rounded-xl flex items-center justify-center text-sm">
                            {c.number}
                          </span>
                          <div>
                            <h4 className="font-bold text-sm text-slate-800">{c.name}</h4>
                            <p className="text-xs text-slate-500 max-w-xs truncate">{c.vision}</p>
                          </div>
                        </div>
                        <div className="flex items-center space-x-2">
                          <button
                            onClick={() => {
                              setEditPaslonData(c);
                              setPaslonNumber(c.number);
                              setPaslonName(c.name);
                              setPaslonVision(c.vision);
                              setShowAddPaslonModal(true);
                            }}
                            className="text-indigo-600 hover:bg-indigo-50 p-2 rounded-lg text-xs font-semibold flex items-center space-x-1"
                          >
                            <EditIcon />
                            <span>Edit</span>
                          </button>
                          <button
                            onClick={() => handleDeletePaslon(c.id)}
                            className="text-rose-600 hover:bg-rose-50 p-2 rounded-lg"
                          >
                            <TrashIcon />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* DAFTAR PEMILIH TETAP (DPT) & TOKEN */}
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="text-lg font-bold text-slate-800">Daftar Pemilih Tetap (DPT) & Token</h3>
                      <p className="text-xs text-slate-500">Kelola token unik dan status memilih siswa</p>
                    </div>
                    <button
                      onClick={() => setShowAddVoterModal(true)}
                      className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-xl flex items-center space-x-1"
                    >
                      <PlusIcon />
                      <span>Tambah Pemilih Baru</span>
                    </button>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="border-b border-slate-200 text-xs font-semibold text-slate-400 uppercase">
                          <th className="py-3 px-4">NAMA PEMILIH</th>
                          <th className="py-3 px-4">KELAS</th>
                          <th className="py-3 px-4">TOKEN</th>
                          <th className="py-3 px-4">STATUS SUARA</th>
                          <th className="py-3 px-4 text-right">AKSI</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 text-sm">
                        {voters.map((v) => (
                          <tr key={v.id}>
                            <td className="py-3 px-4 font-semibold text-slate-800">{v.name}</td>
                            <td className="py-3 px-4 text-slate-600">{v.class}</td>
                            <td className="py-3 px-4 font-mono font-bold text-indigo-600">{v.token}</td>
                            <td className="py-3 px-4">
                              <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${
                                v.hasVoted ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'
                              }`}>
                                {v.hasVoted ? '✓ Sudah Memilih' : '● Belum Memilih'}
                              </span>
                            </td>
                            <td className="py-3 px-4 text-right">
                              <button
                                onClick={() => handleDeleteVoter(v.id)}
                                className="text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg"
                              >
                                <TrashIcon />
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </>
            )}

          </main>

          {/* MODAL ADMIN LOGIN */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl border border-slate-100">
                <h3 className="text-lg font-bold text-slate-800 mb-2 text-center">Verifikasi Admin</h3>
                <p className="text-xs text-slate-500 mb-4 text-center">Masukkan password (Default: <strong>admin123</strong>)</p>

                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <input
                    type="password"
                    placeholder="Masukkan Password Admin"
                    value={inputPassword}
                    onChange={(e) => setInputPassword(e.target.value)}
                    className="w-full px-4 py-2 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                    autoFocus
                  />
                  {loginError && <p className="text-xs text-rose-600 font-medium">{loginError}</p>}

                  <div className="flex space-x-2">
                    <button
                      type="button"
                      onClick={() => setShowLoginModal(false)}
                      className="w-1/2 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold"
                    >
                      Masuk
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL TAMBAH/EDIT PASLON */}
          {showAddPaslonModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100">
                <h3 className="text-lg font-bold text-slate-800 mb-4">
                  {editPaslonData ? 'Edit Pasangan Calon' : 'Tambah Pasangan Calon Baru'}
                </h3>
                <form onSubmit={handleAddOrEditPaslon} className="space-y-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-600 mb-1 block">Nomor Urut</label>
                    <input
                      type="text"
                      placeholder="Contoh: 01"
                      value={paslonNumber}
                      onChange={(e) => setPaslonNumber(e.target.value)}
                      required
                      className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 mb-1 block">Nama Pasangan Calon</label>
                    <input
                      type="text"
                      placeholder="Contoh: Aditya & Siti"
                      value={paslonName}
                      onChange={(e) => setPaslonName(e.target.value)}
                      required
                      className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 mb-1 block">Visi & Misi</label>
                    <textarea
                      rows="3"
                      placeholder="Ringkasan Visi Misi..."
                      value={paslonVision}
                      onChange={(e) => setPaslonVision(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                    ></textarea>
                  </div>
                  <div className="flex space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowAddPaslonModal(false)}
                      className="w-1/2 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold"
                    >
                      Simpan Data
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL TAMBAH PEMILIH (DPT) */}
          {showAddVoterModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100">
                <h3 className="text-lg font-bold text-slate-800 mb-4">Tambah Pemilih Baru</h3>
                <form onSubmit={handleAddVoter} className="space-y-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-600 mb-1 block">Nama Lengkap Siswa</label>
                    <input
                      type="text"
                      placeholder="Contoh: Ahmad Rizky"
                      value={voterName}
                      onChange={(e) => setVoterName(e.target.value)}
                      required
                      className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600 mb-1 block">Kelas</label>
                    <input
                      type="text"
                      placeholder="Contoh: 9 A"
                      value={voterClass}
                      onChange={(e) => setVoterClass(e.target.value)}
                      required
                      className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <div className="flex space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowAddVoterModal(false)}
                      className="w-1/2 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold"
                    >
                      Generate Token & Simpan
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
